name: stylepos
description: "Sami (formerly StylePOS) - an offline-first point-of-sale app for clothing shops, built with Flutter (Android + Windows + Web)."
publish_to: 'none'
version: 1.19.0+32

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Local SQLite storage (sqflite on Android, FFI on Windows desktop)
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4
  path: ^1.9.1
  path_provider: ^2.1.5

  # Backup & restore (zip of DB + photos, share/pick the file)
  archive: ^4.0.0
  share_plus: ^11.0.0
  file_picker: ^10.0.0

  # Formatting
  intl: ^0.20.2

  # PDF receipts
  pdf: ^3.11.2
  printing: ^5.14.2

  # Receipt logo import: pure-Dart decode/resize/encode (works on web too)
  image: ^4.2.0

  # Password hashing
  crypto: ^3.0.6

  # Receipt verifier: fetch receipts straight from the banks (CBE, Telebirr,
  # BOA, M-Pesa, Dashen, Awash, Zemen, CBE Birr, Siinqee, eBirr) and decrypt
  # BOA receipt QR codes (AES-256-CBC + PBKDF2). Inspired by 1RB/cheki (MIT).
  http: ^1.6.0
  pointycastle: ^4.0.0

  # Charts for the reports screen
  fl_chart: ^0.69.2

  # Camera barcode scanning on Android/iOS (hardware scanners use keyboard input)
  mobile_scanner: ^7.0.1

  # Product photos: camera/gallery on phones, file dialog on desktop
  image_picker: ^1.1.2
  file_selector: ^1.0.3

  # Cloud sync (Supabase): auth + database mirror + photo storage
  supabase_flutter: ^2.9.0
  uuid: ^4.5.1
  sqflite_common_ffi_web: ^0.4.0

  # Rive animations (empty-cart delivery truck, checkout success, login hero)
  rive: ^0.13.20  # pinned: 0.14.x changed the native API; 0.13.20 is stable on all 3 platforms
  lottie: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/rive/
    - assets/lottie/

  # App-wide UI font (also used by the PDF receipt generator for consistency;
  # good unicode currency coverage, fully offline)
  fonts:
    - family: Carlito
      fonts:
        - asset: assets/fonts/Carlito-Regular.ttf
        - asset: assets/fonts/Carlito-Bold.ttf
          weight: 700
    - family: ReceiptFont
      fonts:
        - asset: assets/fonts/Carlito-Regular.ttf
        - asset: assets/fonts/Carlito-Bold.ttf
          weight: 700

# Launcher icons for every device (generated once via `dart run flutter_launcher_icons`):
# Android adaptive (gradient background + glyph foreground) & legacy, Windows .ico, web favicon.
flutter_launcher_icons:
  image_path: assets/icon/sami_icon.png
  android: true
  adaptive_icon_background: assets/icon/sami_background.png
  adaptive_icon_foreground: assets/icon/sami_foreground.png
  windows:
    generate: true
    image_path: assets/icon/sami_icon.png
    icon_size: 256
  web:
    generate: true
    image_path: assets/icon/sami_icon.png
    favicon: true
