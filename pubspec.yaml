name: stylepos
description: "StylePOS - an offline-first point-of-sale app for clothing shops, built with Flutter (Android + Windows + Web)."
publish_to: 'none'
version: 1.10.3+15

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Local SQLite storage (sqflite on Android, FFI on Windows desktop)
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4
  path: ^1.9.1
  path_provider: ^2.1.5

  # Backup & restore (zip of DB + photos, share/pick the file)
  archive: ^4.0.0
  share_plus: ^11.0.0
  file_picker: ^10.0.0

  # Formatting
  intl: ^0.20.2

  # PDF receipts
  pdf: ^3.11.2
  printing: ^5.14.2

  # Password hashing
  crypto: ^3.0.6

  # Charts for the reports screen
  fl_chart: ^0.69.2

  # Camera barcode scanning on Android/iOS (hardware scanners use keyboard input)
  mobile_scanner: ^7.0.1

  # Product photos: camera/gallery on phones, file dialog on desktop
  image_picker: ^1.1.2
  file_selector: ^1.0.3

  # Cloud sync (Supabase): auth + database mirror + photo storage
  supabase_flutter: ^2.9.0
  uuid: ^4.5.1
  sqflite_common_ffi_web: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  # App-wide UI font (also used by the PDF receipt generator for consistency;
  # good unicode currency coverage, fully offline)
  fonts:
    - family: Carlito
      fonts:
        - asset: assets/fonts/Carlito-Regular.ttf
        - asset: assets/fonts/Carlito-Bold.ttf
          weight: 700
    - family: ReceiptFont
      fonts:
        - asset: assets/fonts/Carlito-Regular.ttf
        - asset: assets/fonts/Carlito-Bold.ttf
          weight: 700
