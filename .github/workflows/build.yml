name: Build Sami

# Builds on every push to main, and produces downloadable installers.
# Pushing a tag like v1.24.1 additionally creates a GitHub Release
# with the Android APKs and the Windows zip attached.
# Every main push / tag also redeploys the web app to GitHub Pages:
# https://l3von36.github.io/stylepos/
#
# NOTE on job status: on plain main pushes the release job shows "Skipped"
# — that is by design, not a failure. Public GitHub Releases are cut only
# from version tags (vX.Y.Z), so the release page stays clean and every
# release maps 1:1 to a version. Fresh installers from main pushes live in
# the run's Artifacts; the run summary (bottom of the Summary page) always
# explains what ran and what was skipped.
#
# APK size strategy (v1.5.0): per-ABI splits (arm64 primary, armv7 fallback,
# x86_64 emulators skipped), R8 + resource shrinking, and Dart obfuscation
# with debug symbols uploaded as a separate artifact.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Restore upload signing key
        env:
          STYLEPOS_UPLOAD_KEY_B64: ${{ secrets.ANDROID_UPLOAD_KEY_B64 }}
        run: echo -n "$STYLEPOS_UPLOAD_KEY_B64" | base64 -d > "$RUNNER_TEMP/stylepos-upload.keystore"

      - name: Build release APKs (per-ABI split + obfuscated)
        env:
          STYLEPOS_UPLOAD_KEYSTORE: ${{ runner.temp }}/stylepos-upload.keystore
          STYLEPOS_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          STYLEPOS_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
        run: >-
          flutter build apk --release --split-per-abi
          --obfuscate --split-debug-info=build/app/debug-symbols/android

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Sami-android-apk
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 30

      - name: Upload obfuscation debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: Sami-android-debug-symbols
          path: build/app/debug-symbols/android
          retention-days: 90

  build-windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - name: Enable Windows desktop support
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Zip release folder
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Sami-windows-x64.zip
        shell: pwsh

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sami-windows-x64
          path: Sami-windows-x64.zip
          retention-days: 30

  build-web:
    name: Web app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web release
        run: flutter build web --release

      - name: Zip web build
        run: |
          cd build/web
          zip -qr ../../Sami-web.zip .
          cd ../..

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sami-web
          path: Sami-web.zip
          retention-days: 30

  # GitHub Pages live site (https://l3von36.github.io/stylepos/).
  # Built with --base-href=/stylepos/ so all assets resolve under the
  # project-pages sub-path. Runs on main pushes and version tags.
  deploy-web:
    name: Deploy web to GitHub Pages
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web for GitHub Pages
        run: flutter build web --release --base-href=/stylepos/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Publish GitHub Release (v* tags only — Skipped on main pushes is expected)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-android, build-windows, build-web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename files for release
        run: |
          mv artifacts/Sami-android-apk/app-arm64-v8a-release.apk Sami-android-arm64.apk
          mv artifacts/Sami-android-apk/app-armeabi-v7a-release.apk Sami-android-armv7.apk
          mv artifacts/Sami-windows-x64/Sami-windows-x64.zip Sami-windows-x64.zip
          mv artifacts/Sami-web/Sami-web.zip Sami-web.zip

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Sami-android-arm64.apk
            Sami-android-armv7.apk
            Sami-windows-x64.zip
            Sami-web.zip
          generate_release_notes: true

  # Always-run summary so nobody has to guess what a run did. Renders a
  # job-result table on the run's Summary page and, when the release job was
  # skipped (i.e. this was a main push, not a tag), states exactly why and
  # how to publish a release. Cost: one 5-second ubuntu job.
  run-summary:
    name: Run summary
    if: always()
    needs: [build-android, build-windows, build-web, deploy-web, release]
    runs-on: ubuntu-latest
    steps:
      - name: Write run summary
        env:
          ANDROID_RESULT: ${{ needs.build-android.result }}
          WINDOWS_RESULT: ${{ needs.build-windows.result }}
          WEB_RESULT: ${{ needs.build-web.result }}
          PAGES_RESULT: ${{ needs.deploy-web.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
          RUN_ID: ${{ github.run_id }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          {
            echo "## Build Sami — $REF_NAME"
            echo
            echo "| Job | Result |"
            echo "|-----|--------|"
            echo "| Android APK | $ANDROID_RESULT |"
            echo "| Windows EXE | $WINDOWS_RESULT |"
            echo "| Web app | $WEB_RESULT |"
            echo "| Deploy web to GitHub Pages | $PAGES_RESULT |"
            echo "| Publish GitHub Release | $RELEASE_RESULT |"
            echo
            if [ "$RELEASE_RESULT" = "skipped" ]; then
              echo "> ℹ️ **Release skipped on purpose — nothing is broken.** This run was triggered by a push to \`main\`, and public GitHub Releases are published **only from version tags** (\`vX.Y.Z\`), so every release maps 1:1 to a version."
              echo ">"
              echo "> The freshly built installers are on this run under **Artifacts** (Sami-android-apk / Sami-windows-x64 / Sami-web)."
              echo "> To publish a release, push a version tag: \`git tag vX.Y.Z && git push origin vX.Y.Z\` — the release job then attaches the APKs, Windows zip and web zip to a new GitHub Release automatically."
            fi
            echo
            echo "Live web app: https://l3von36.github.io/stylepos/ · [This run](https://github.com/L3von36/stylepos/actions/runs/$RUN_ID)"
          } >> "$GITHUB_STEP_SUMMARY"
