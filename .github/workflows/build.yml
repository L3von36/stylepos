name: Build StylePOS

# Builds on every push to main, and produces downloadable installers.
# Pushing a tag like v1.0.0 additionally creates a GitHub Release
# with the Android APKs and the Windows zip attached.
#
# APK size strategy (v1.5.0): per-ABI splits (arm64 primary, armv7 fallback,
# x86_64 emulators skipped), R8 + resource shrinking, and Dart obfuscation
# with debug symbols uploaded as a separate artifact.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APKs (per-ABI split + obfuscated)
        run: >-
          flutter build apk --release --split-per-abi
          --obfuscate --split-debug-info=build/app/debug-symbols/android

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StylePOS-android-apk
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 30

      - name: Upload obfuscation debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: StylePOS-android-debug-symbols
          path: build/app/debug-symbols/android
          retention-days: 90

  build-windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - name: Enable Windows desktop support
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Zip release folder
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath StylePOS-windows-x64.zip
        shell: pwsh

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: StylePOS-windows-x64
          path: StylePOS-windows-x64.zip
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename files for release
        run: |
          mv artifacts/StylePOS-android-apk/app-arm64-v8a-release.apk StylePOS-android-arm64.apk
          mv artifacts/StylePOS-android-apk/app-armeabi-v7a-release.apk StylePOS-android-armv7.apk
          mv artifacts/StylePOS-windows-x64/StylePOS-windows-x64.zip StylePOS-windows-x64.zip

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            StylePOS-android-arm64.apk
            StylePOS-android-armv7.apk
            StylePOS-windows-x64.zip
          generate_release_notes: true
